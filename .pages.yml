content:
  - name: site
    label: Site Settings
    type: file
    path: app/content/site.mdx
    format: yaml-frontmatter
    fields:
      - name: siteName
        label: Site Name
        type: string
        required: true
        description: "Tip: Most settings here can be used as tokens (e.g., {{siteName}}, {{ownerName}}) in any CMS text field."
      - name: siteUrl
        label: Site URL
        type: string
        required: true
      - name: siteLocale
        label: Site Locale
        type: string
        required: true
        default: "en-US"
      - name: siteTimeZone
        label: Site Time Zone
        type: select
        required: true
        default: "America/New_York"
        options:
          values:
            - value: "America/New_York"
              label: "Eastern Time (ET)"
            - value: "America/Chicago"
              label: "Central Time (CT)"
            - value: "America/Denver"
              label: "Mountain Time (MT)"
            - value: "America/Phoenix"
              label: "Mountain Time - No DST (Arizona)"
            - value: "America/Los_Angeles"
              label: "Pacific Time (PT)"
            - value: "America/Anchorage"
              label: "Alaska Time (AKT)"
            - value: "America/Adak"
              label: "Hawaii-Aleutian Time (HAT)"
            - value: "Pacific/Honolulu"
              label: "Hawaii Time (HST)"
      - name: siteTitle
        label: Site Title (SEO)
        type: string
        required: true
      - name: siteDescription
        label: Site Description (SEO)
        type: text
        required: true
      - name: ownerName
        label: Owner Name
        type: string
        required: true
      - name: contactName
        label: Contact Name
        type: string
        required: true
      - name: contactEmail
        label: Contact Email
        type: string
        required: true
      - name: contactPhone
        label: Contact Phone
        type: string
        required: false

  - name: blog
    label: Blog Posts
    type: collection
    path: app/content/blog
    format: yaml-frontmatter
    filename: "{fields.slug}.mdx"
    view:
      fields: [title, author, publishedDate, lastModified]
      primary: title
      sort: [publishedDate, title]
      default:
        sort: publishedDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "Post headline shown on blog cards, article page, and SEO title."
      - name: slug
        label: Slug
        type: string
        required: true
        description: "URL-safe id used in the path. Example: dnd-resurgence-stranger-things"
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: "Use lowercase letters, numbers, and hyphens only (example: session-zero-basics)."
      - name: synopsis
        label: Synopsis
        type: text
        required: true
        description: "One or two sentences for blog cards and meta description."
      - name: author
        label: Author
        type: string
        required: true
        description: "Display name shown under the post title."
      - name: publishedDate
        label: Published Date
        type: date
        required: true
        description: "Original publish date used for ordering and sitemap lastmod fallback."
      - name: lastModified
        label: Last Modified
        type: date
        required: false
        description: "Optional update date (YYYY-MM-DD). Leave blank unless content changed."
      - name: imageUrl
        label: Image URL
        type: string
        required: true
        description: "Paste the URL from the browser address bar of an image page on Pexels or Unsplash."
        pattern:
          regex: "^https://(?:(?:www\\.)?pexels\\.com/|images\\.pexels\\.com/|(?:www\\.)?unsplash\\.com/|images\\.unsplash\\.com/).+"
          message: "Use a URL from Pexels or Unsplash only."
      - name: imageAlt
        label: Image Alt Text
        type: string
        required: true
        description: "Short, specific description for accessibility."
      - name: imageCreditName
        label: Image Credit Name
        type: string
        required: false
        description: "Optional photographer/source name shown below the image."
      - name: body
        label: Post Body
        type: code
        options:
          language: markdown
        required: true
        description: "Markdown/MDX content. Use <BlogCta /> where you want the inline CTA."

  - name: faq
    label: FAQ
    type: file
    path: app/content/faq.md
    format: raw
    fields:
      - name: body
        label: FAQ Content
        type: code
        options:
          language: markdown
        required: true
        description: "Use `## Question` headings and put each markdown answer directly underneath."

  - name: about
    label: Home About
    type: file
    path: app/content/about.mdx
    format: yaml-frontmatter
    fields:
      - name: title
        label: About Title
        type: string
        required: true
        description: "Main heading shown at the top of the About section."
      - name: stickerQuote
        label: Sticker Quote
        type: string
        required: true
        description: "Quote shown in the red sticker."
      - name: promiseTitle
        label: Promise Title
        type: string
        required: true
      - name: promiseBody
        label: Promise Body
        type: text
        required: true
      - name: promiseButtonText
        label: Promise Button Text
        type: string
        required: true
      - name: body
        label: About Copy
        type: code
        options:
          language: markdown
        required: true
        description: "Main paragraph copy for the About section."

  - name: privacy
    label: Privacy Policy
    type: file
    path: app/content/privacy.md
    format: raw
    fields:
      - name: body
        label: Privacy Content
        type: code
        options:
          language: markdown
        required: true
        description: "Markdown content for the Privacy Policy page."

  - name: terms
    label: Terms of Service
    type: file
    path: app/content/terms.md
    format: raw
    fields:
      - name: body
        label: Terms Content
        type: code
        options:
          language: markdown
        required: true
        description: "Markdown content for the Terms of Service page."

  - name: services
    label: Services
    type: file
    path: app/content/services.mdx
    format: yaml-frontmatter
    fields:
      - name: title
        label: Section Title
        type: string
        required: true
      - name: subtitle
        label: Section Subtitle
        type: string
        required: true
      - name: items
        label: Service Cards
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: price
            label: Price/Tagline
            type: string
            required: true
          - name: desc
            label: Description
            type: text
            required: true
          - name: cta
            label: CTA Label
            type: string
            required: true
          - name: highlight
            label: Highlight Card?
            type: boolean
            default: false
          - name: intent
            label: Booking Intent Slug
            type: select
            required: true
            description: "Determines which form is shown on the booking page."
            options:
              values:
                - value: "weekly"
                  label: "Weekly Campaign"
                - value: "party"
                  label: "One-Off / Party"
                - value: "workshop"
                  label: "Workshop / Class"

  - name: dndInfo
    label: What is D&D
    type: file
    path: app/content/dnd-info.mdx
    format: yaml-frontmatter
    fields:
      - name: title
        label: Section Title
        type: string
        required: true
      - name: introParagraph1
        label: Intro Paragraph 1
        type: text
        required: true
      - name: introQuote
        label: Intro Quote
        type: string
        required: true
      - name: introParagraph2
        label: Intro Paragraph 2
        type: text
        required: true
      - name: benefits
        label: Benefits List
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: desc
            label: Description
            type: string
            required: true

  - name: patrons
    label: Patron Portal
    type: file
    path: app/content/patrons.mdx
    format: yaml-frontmatter
    fields:
      - name: title
        label: Section Title
        type: string
        required: true
      - name: testimonials
        label: Testimonials
        type: object
        list: true
        fields:
          - name: quote
            label: Quote
            type: text
            required: true
          - name: author
            label: Author/Attribution
            type: string
            required: true
      - name: resourcesTitle
        label: Resources Title
        type: string
        required: true
      - name: resourcesDesc
        label: Resources Description
        type: text
        required: true
      - name: safetyGuideLabel
        label: Safety Guide Button Label
        type: string
        required: true
      - name: safetyGuideUrl
        label: Safety Guide URL
        type: string
        required: true
      - name: consentFormLabel
        label: Consent Form Button Label
        type: string
        required: true
      - name: consentFormUrl
        label: Consent Form URL
        type: string
        required: true

  - name: footer
    label: Footer
    type: file
    path: app/content/footer.mdx
    format: yaml-frontmatter
    fields:
      - name: tagline
        label: Brand Tagline
        type: string
        required: true
      - name: copyright
        label: Copyright Text
        type: string
        required: true
        description: "Year is replaced automatically via {{year}}."
      - name: disclaimer
        label: Disclaimer Text
        type: text
        required: true
      - name: privacyLabel
        label: Privacy Link Label
        type: string
        required: true
      - name: termsLabel
        label: Terms Link Label
        type: string
        required: true
